# harmony
settings.tk-multi-loader2.harmony:
  actions_hook: '{engine}/tk-multi-loader2/tk-harmony_actions.py'
  action_mappings:
    Alembic Cache: [3d]
    FBX File: [3d]
    OBJ File: [3d]
    3DS File: [3d]
    OBS File: [3d]
    Movie File: [movie]
    Image: [drawing]
    Texture: [drawing]
    # was [drawing] (single-file import) — a Rendered Image PublishedFile
    # is actually a whole sequence (frame_spec path), so it needs the
    # multi-file element import, same as Harmony Element below.
    Rendered Image: [sequence]
    Photoshop Image: [drawing]
    WAV File: [sound]
    Sound File: [sound]
    Audio File: [sound]
    Harmony Template: [template]
    Harmony Palette: [palette]
    Harmony Element: [element]
    # Harmony Camera Data intentionally has no action mapping — it's an
    # export for downstream tools (Nuke via .chan), not something meant
    # to be loaded back into Harmony itself.
  entities:
  - caption: Assets
    entity_type: Asset
    filters:
    - [project, is, "{context.project}"]
    hierarchy: [sg_asset_type, code]
  - caption: Shots
    entity_type: Shot
    filters:
    - [project, is, "{context.project}"]
    hierarchy: [sg_sequence, code]
  - caption: My Tasks
    entity_type: Task
    filters:
    - [task_assignees, is, "{context.user}"]
    - [project, is, "{context.project}"]
    hierarchy: [entity, content]
  publish_filters: [["sg_status_list", "is_not", null]]
  location: "@apps.tk-multi-loader2.location"
